# Render Blueprint: the API and console as one Docker web service, plus a
# free Redis-compatible Key Value store. Postgres is on Neon, whose free
# plan doesn't expire (Render's free Postgres is deleted after 30 days).
# Deploy from the Render dashboard: New > Blueprint, pick this repo, and
# paste Neon's direct (not pooled) connection string as DATABASE_URL.
services:
  - type: web
    name: go-ledger
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: go-ledger-redis
          property: connectionString
      # The public demo is built with the fault-injection endpoints, via the
      # Dockerfile's ARG GO_TAGS. This relies on Render passing env vars to
      # Docker builds as build args: after a deploy, GET /api/chaos should
      # answer 200 (a default build answers 404).
      - key: GO_TAGS
        value: chaos
      # Per-IP write limit. HOPS=1 assumes one proxy appends to
      # X-Forwarded-For in front of the app; check a request's header after
      # deploying, since a wrong value makes visitors share a bucket.
      - key: WRITE_RATE_PER_IP
        value: "5"
      - key: WRITE_BURST_PER_IP
        value: "150"
      - key: RATE_LIMIT_PROXY_HOPS
        value: "1"

  - type: keyvalue
    name: go-ledger-redis
    plan: free
    # No external access: only the web service talks to it.
    ipAllowList: []
