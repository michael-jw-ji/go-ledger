# Render Blueprint: the API and console as one Docker web service, plus a
# free Postgres database and a free Redis-compatible Key Value store.
# Deploy from the Render dashboard: New > Blueprint, pick this repo.
services:
  - type: web
    name: go-ledger
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: go-ledger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: go-ledger-redis
          property: connectionString

  - type: keyvalue
    name: go-ledger-redis
    plan: free
    # No external access: only the web service talks to it.
    ipAllowList: []

databases:
  - name: go-ledger-db
    plan: free
