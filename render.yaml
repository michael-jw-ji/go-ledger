# Render Blueprint: the API and console as one Docker web service, plus a
# free Redis-compatible Key Value store. Postgres is on Neon, whose free
# plan doesn't expire (Render's free Postgres is deleted after 30 days).
# Deploy from the Render dashboard: New > Blueprint, pick this repo, and
# paste Neon's direct (not pooled) connection string as DATABASE_URL.
services:
  - type: web
    name: go-ledger
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: go-ledger-redis
          property: connectionString

  - type: keyvalue
    name: go-ledger-redis
    plan: free
    # No external access: only the web service talks to it.
    ipAllowList: []
