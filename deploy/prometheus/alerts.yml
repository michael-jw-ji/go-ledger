groups:
  - name: ledger
    rules:
      # Cached state disagrees with the entries. Never expected; page someone.
      - alert: LedgerReconciliationMismatch
        expr: sum(ledger_reconciliation_mismatches) > 0
        labels:
          severity: page
        annotations:
          summary: "Reconciliation found {{ $value }} mismatches"
          description: "Run `ledger recon` and check reconciliation_runs.details for the accounts involved."

      # A detective control that stopped running detects nothing.
      - alert: LedgerReconciliationStale
        expr: time() - ledger_reconciliation_last_success_timestamp > 300
        labels:
          severity: ticket
        annotations:
          summary: "No successful reconciliation for 5 minutes"

      # Reads stay correct while pending rows pile up, but a growing backlog
      # means the rollup worker is down or can't keep up.
      - alert: LedgerRollupBacklog
        expr: ledger_hot_pending_entries > 10000
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} hot-account entries waiting for the rollup worker"

      # Events are safe in Postgres while they wait, but consumers are
      # working from stale information.
      - alert: LedgerOutboxLag
        expr: outbox_lag_seconds > 60
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Oldest unpublished ledger event is {{ $value }}s old"
          description: "Check Redis and outbox_publish_failures_total."
