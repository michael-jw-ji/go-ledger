name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: lint
        run: make lint
      - name: unit tests
        run: make test TESTFLAGS=-race
      # The default binary must not contain the fault-injection endpoints.
      - name: default build has no chaos endpoints
        run: |
          go build -o /tmp/ledger ./cmd/ledger
          if grep -q 'chaos/flush-redis' /tmp/ledger; then echo "chaos code in the default build"; exit 1; fi
      # Testcontainers starts Postgres and Redis on the runner's Docker. The
      # chaos tag adds the fault-injection tests to the full suite.
      - name: integration tests
        run: make test-chaos TESTFLAGS="-race -timeout=15m"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build the deploy image
        run: docker build -t go-ledger:ci .
      - name: build the demo image (chaos)
        run: docker build --build-arg GO_TAGS=chaos -t go-ledger:ci-chaos .
